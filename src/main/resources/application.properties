spring.application.name=PokedexApi
spring.application.version=1.10.1
spring.jmx.enabled=true
spring.main.allow-bean-definition-overriding=true

skaro.pokeapi.baseUri=https://mypokedex.us/springboot
skaro.pokeapi.maxBytesToBuffer=5065000
server.tomcat.connection-timeout=200000
server.servlet.context-path=/springboot

spring.profiles.active=production
#server.port=4204
# http://<HOST><CONTEXT-PATH>/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.showExtensions=true
springdoc.swagger-ui.displayRequestDuration=true

# Springdocs Swagger/OpenAPI configuration
# http://<HOST><CONTEXT-PATH>/swagger-ui/index.html
#springdoc.swagger-ui.config-url=${server.servlet.context-path}/${springdoc.api-docs.path}/swagger-config
springdoc.swagger-ui.config-url=/springboot/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/springboot/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
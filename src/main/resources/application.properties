spring.application.name=PokedexApi
spring.application.version=1.10.2
spring.jmx.enabled=true
spring.main.allow-bean-definition-overriding=true

skaro.pokeapi.baseUri=https://pokeapi.co/api/v2/
skaro.pokeapi.maxBytesToBuffer=5065000
server.tomcat.connection-timeout=200000
server.servlet.context-path=/

spring.profiles.active=production

fetch.max.attempts=1
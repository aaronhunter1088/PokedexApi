name: Revert To Previous Version of Pokédex API Spring Boot

on:
  workflow_dispatch:

jobs:
  revert-to-previous:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo 'whoami' 
            whoami
            echo 'hostname'
            hostname
            echo 'java -version'
            java -version

      - name: Revert to Previous Pokédex API Spring Boot Version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop Tomcat 11 Service
            sudo systemctl stop tomcat11

            # Copy Previous Jar into Current Deployment
            sudo cp -a /opt/tomcat11/MyPokedexBackup/springboot/WEB-INF/lib/PokedexApi-*-code.jar \
                       /opt/tomcat11/MyPokedex/springboot/WEB-INF/lib

            # Update Permissions Again
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedex/springboot/WEB-INF/lib/PokedexApi-*-code.jar
            sudo chmod -R 644 /opt/tomcat11/MyPokedex/springboot/WEB-INF/lib/PokedexApi-*-code.jar

            # Start Tomcat 11 Service
            sudo systemctl start tomcat11

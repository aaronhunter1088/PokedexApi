# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will test connection to the VPS, checking out
# the code, setting up Java, builds the code, and deploys
# the JAR to the temporary directory.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Deploy Pokédex API Spring Boot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Pokédex API JAR
        run: ./mvnw clean package
        
      - name: Upload Pokédex API JAR
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Maven outputs the code jar to dist/<version>/PokedexApi-<version>-code.jar
          source: "dist/*/PokedexApi-*-code.jar"
          target: "/tmp/deploy"

      - name: Copy Previous Working Version, Deploy JAR
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Stop script on a failing command rather than blindly continuing
            set -e
            # Stop Tomcat 11 Service
            sudo systemctl stop tomcat11

            # Copy Previous Working Version
            cd /opt/tomcat11/MyPokedex/springboot/WEB-INF/lib
            sudo cp -a PokedexApi-*-code.jar MyPokedexBackup/springboot/WEB-INF/lib/

            # Prepare New Version
            sudo mv /tmp/deploy/dist/*/PokedexApi-*-code.jar \
                    /opt/tomcat11/MyPokedex/springboot/WEB-INF/lib

            # Update Ownership
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedex/springboot
            sudo chown -R tomcat:tomcat /opt/tomcat11/MyPokedexBackup/springboot

            # Update Permissions
            sudo find /opt/tomcat11/MyPokedex/springboot -type d -exec chmod 755 {} \;
            sudo find /opt/tomcat11/MyPokedex/springboot -type f -exec chmod 644 {} \;

            # Start Tomcat 11 Service
            sudo systemctl start tomcat11
            timeout 120 bash -c 'until sudo systemctl is-active --quiet tomcat11; do sleep 3; done'
            sudo journalctl -u tomcat11 -n 100 --no-pager
